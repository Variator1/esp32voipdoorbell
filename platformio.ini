;PlatformIO Project Configuration File

[env:esp32dev]
platform = espressif32@1.12.4
board = esp32dev
framework = arduino
board_build.mcu = esp32
board_build.f_cpu = 240000000L
monitor_speed = 115200
board_build.partitions = default.csv

build_flags =
    -std=c++11
    -DARDUINO_ARCH_ESP32
    -DCORE_DEBUG_LEVEL=0
    -include math.h
    -fpermissive

lib_deps =
    ConfigManager@>=1.5.2
    sstaub/NTP@1.6.0
